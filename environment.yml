name: orbit-manifest
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # build
  - pybind11
  - setuptools
  - cmake
  # numerics / science
  - numpy
  - scipy
  - matplotlib
  # Pin the BLAS implementation to OpenBLAS. The MKL build conda-forge resolves
  # to on this platform kills the interpreter on matrix multiply — a delay-load
  # failure (0xC06D007F), not a Python exception. Without this pin a fresh
  # `conda env create` reintroduces the bug. See CLAUDE.md → Known environment fault.
  - libblas=*=*openblas
  # networking / config
  - requests
  - python-dotenv
  # TLE propagation (situational awareness layer)
  - sgp4
  # testing
  - pytest
  # Claude API (conda-forge lags behind; pin to pip)
  - pip
  - pip:
    - anthropic
